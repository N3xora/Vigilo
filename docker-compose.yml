name: vigilo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigilo
      POSTGRES_PASSWORD: vigilo-dev-secret
      POSTGRES_DB: vigilo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - vigilo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigilo -d vigilo"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - vigilo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # adobe/s3mock, not minio: MinIO's 2025 licensing change pulled every
  # free/anonymous image tag for it across Docker Hub, Bitnami and
  # quay.io — confirmed against a real, authenticated Docker Hub login,
  # the minio/minio repository itself is gone, not merely access-gated
  # (.github/workflows/ci.yml hit the same thing). s3mock is a real,
  # unauthenticated S3-API server; access/secret keys are fixed "test"
  # values because s3mock's community edition doesn't check them.
  minio:
    image: adobe/s3mock:latest
    restart: unless-stopped
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: vigilo-evidence
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9010:9090"
    volumes:
      - vigilo_minio_data:/s3mockroot
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vigilo_postgres_data:
  vigilo_redis_data:
  vigilo_minio_data:
